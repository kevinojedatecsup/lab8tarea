</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Dustin Ojeda</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="sobre-mi.html">Sobre mí</a></li>

                    <li class="nav-item"><a class="nav-link" href="educacion.html">Educación</a></li>
                    <li class="nav-item"><a class="nav-link" href="habilidades.html">Habilidades</a></li>
                    <li class="nav-item"><a class="nav-link" href="proyectos.html">Proyectos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contáctame</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="container my-5">
        <h2 class="section-title">Contáctame</h2>

        <div class="row">
            <div class="col-md-6">
                <!--
                    method="GET" y action="confirmacion.html": al enviar el formulario,
                    el navegador redirige directamente a la página de confirmación.
                -->
                <form action="confirmacion.html" method="GET">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>

            <div class="col-md-6">
                <h5>Otra forma de contactarme</h5>
                <p>Correo: kevin.ojeda.c@tecsup.edu.pe</p>
            </div>
        </div>
    </section>

    <footer class="text-center">
        <div class="container">
            <p class="mb-1">Dustin Ojeda Cjuno</p>
            <p class="mb-0">kevin.ojeda.c@tecsup.edu.pe</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
